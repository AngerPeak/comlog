<div class="app">

    <div class="brand" id="brand"></div>

      <h1 id="pageTitle">Заказы</h1>

        <button class="icon-btn sync-badge" id="syncBadge" hidden><svg><use href="#i-sync"/></svg></button>
        <div class="bell-wrap">

          <div class="bell-pop" id="bellPop" hidden></div>
        </div>
        <div class="matter-pill" id="matterPill" data-goto="shop" title="Материя — валюта магазина">
          <svg class="matter-ico"><use href="#i-matter"/></svg>
          <b id="matterTop">0</b>
          <span class="plus"><svg><use href="#i-plus"/></svg></span>
        </div>
      </div>
    </header>

    <section class="page active" id="page-orders"></section>
    <section class="page" id="page-analytics"></section>
    <section class="page" id="page-clients"></section>
    <section class="page" id="page-pricelist"></section>

    <section class="page" id="page-shop"></section>
    <section class="page" id="page-achievements"></section>
    <section class="page" id="page-settings"></section>
  </main>
</div>
